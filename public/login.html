<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo | USM Postgrado en Derecho</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🔒</text></svg>">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0d233a 0%, #1a237e 50%, #0d233a 100%);
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 15px;
        }
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            border-top: 5px solid #c9a84c;
        }
        .login-header {
            background: linear-gradient(135deg, #0d233a, #1a237e);
            color: #ffffff;
            padding: 30px 25px;
            text-align: center;
        }
        .login-logo {
            width: 60px;
            height: 60px;
            background: #c9a84c;
            color: #0d233a;
            font-size: 24px;
            font-weight: 900;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .login-header h2 {
            font-size: 20px;
            margin: 0 0 5px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        .login-header p {
            font-size: 13px;
            color: #c5cae9;
            margin: 0;
        }
        .login-body {
            padding: 30px 25px;
        }
        .form-group-login {
            margin-bottom: 20px;
        }
        .form-group-login label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #1a237e;
            margin-bottom: 6px;
        }
        .input-icon-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-icon-wrapper .input-icon {
            position: absolute;
            left: 12px;
            font-size: 16px;
            color: #777;
            pointer-events: none;
        }
        .input-icon-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .input-icon-wrapper input:focus {
            border-color: #1a237e;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.15);
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #777;
            padding: 0;
        }
        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #1a237e, #283593);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(26, 35, 126, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #283593, #3949ab);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(26, 35, 126, 0.35);
        }
        .btn-login:disabled {
            background: #9fa8da;
            cursor: not-allowed;
            transform: none;
        }
        .login-alert {
            display: none;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            align-items: center;
            gap: 10px;
        }
        .login-alert.error {
            display: flex;
            background: #ffebee;
            border: 1px solid #ef9a9a;
            color: #c62828;
        }
        .login-footer-links {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        .login-footer-links a {
            color: #5c6bc0;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .login-footer-links a:hover {
            color: #1a237e;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div style="display: flex; justify-content: center; align-items: center; gap: 14px; margin-bottom: 14px;">
                    <div style="background: #ffffff; padding: 5px 12px; border-radius: 10px; border: 2px solid #c9a84c; box-shadow: 0 4px 10px rgba(0,0,0,0.25);">
                        <img src="/img/logo_usm.png" alt="Universidad Santa María" style="height: 40px; width: auto; display: block;">
                    </div>
                    <div style="background: #ffffff; padding: 4px 6px; border-radius: 10px; border: 2px solid #c9a84c; box-shadow: 0 4px 10px rgba(0,0,0,0.25);">
                        <img src="/img/facultad_derecho.jpg" alt="Facultad de Derecho" style="height: 46px; width: auto; display: block;">
                    </div>
                </div>
                <h2>Facultad de Derecho</h2>
                <p>Dirección de Postgrado | Acceso Administrativo</p>
            </div>

            <div class="login-body">
                <div id="loginAlert" class="login-alert">
                    <span>⚠️</span>
                    <span id="loginAlertText">Usuario o contraseña incorrectos.</span>
                </div>

                <form id="formLogin" onsubmit="ejecutarLogin(event)" autocomplete="off">
                    <div class="form-group-login">
                        <label for="usuario">Usuario Administrador</label>
                        <div class="input-icon-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required autofocus>
                        </div>
                    </div>

                    <div class="form-group-login">
                        <label for="clave">Contraseña</label>
                        <div class="input-icon-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="clave" name="clave" placeholder="Ingrese su contraseña" required>
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()" title="Mostrar/Ocultar contraseña">
                                👁️
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="btnLogin" class="btn-login">
                        <span>🔐 Iniciar Sesión</span>
                    </button>
                </form>

                <div class="login-footer-links">
                    <a href="/">⬅️ Volver a Preinscripción</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Si ya hay sesión abierta, redirigir automáticamente a admin
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/admin/verificar-sesion');
                const data = await res.json();
                if (data.autenticado) {
                    window.location.href = '/admin.html';
                }
            } catch (e) {
                // No autenticado
            }
        });

        function togglePasswordVisibility() {
            const input = document.getElementById('clave');
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }

        async function ejecutarLogin(e) {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value.trim();
            const clave = document.getElementById('clave').value;
            const alertBox = document.getElementById('loginAlert');
            const alertText = document.getElementById('loginAlertText');
            const btn = document.getElementById('btnLogin');

            if (!usuario || !clave) {
                alertBox.className = 'login-alert error';
                alertText.textContent = 'Por favor complete todos los campos.';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span>⏳ Verificando...</span>';
            alertBox.className = 'login-alert';

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, clave })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    btn.innerHTML = '<span>✅ Acceso concedido...</span>';
                    window.location.href = '/admin.html';
                } else {
                    alertBox.className = 'login-alert error';
                    alertText.textContent = data.message || 'Usuario o contraseña incorrectos.';
                    btn.disabled = false;
                    btn.innerHTML = '<span>🔐 Iniciar Sesión</span>';
                    document.getElementById('clave').value = '';
                    document.getElementById('clave').focus();
                }
            } catch (err) {
                alertBox.className = 'login-alert error';
                alertText.textContent = 'Error de conexión con el servidor. Intente de nuevo.';
                btn.disabled = false;
                btn.innerHTML = '<span>🔐 Iniciar Sesión</span>';
            }
        }
    </script>
</body>
</html>
